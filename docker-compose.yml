name: food-delivery-system

services:
  database:
    image: mongo:8.3
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  backend:
    build: ./BackEnd
    restart: unless-stopped
    environment:
      PORT: 5000
      # Uses the local database container unless MONGO_URI is set in .env (e.g. MongoDB Atlas)
      MONGO_URI: ${MONGO_URI:-mongodb://database:27017/food-delivery}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - copy .env.example to .env}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - data
      - web
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./FrontEnd
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    security_opt:
      - no-new-privileges:true

# Only the frontend publishes a port. The database is reachable by the backend alone.
networks:
  web:
  data:

volumes:
  mongo_data:
