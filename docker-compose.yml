name: food-delivery-system

services:
  backend:
    build: ./BackEnd
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env to your MongoDB Atlas connection string}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env - copy .env.example to .env}
    networks:
      - web
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./FrontEnd
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    security_opt:
      - no-new-privileges:true

# Only the frontend publishes a port. The database is MongoDB Atlas (set MONGO_URI in .env).
networks:
  web:
