# Jenkins CI server, separate from the app stack.
# Start:  docker compose -f docker-compose.jenkins.yml up -d --build
# Open:   http://localhost:8080
name: food-delivery-jenkins

services:
  jenkins:
    build: ./jenkins
    restart: unless-stopped
    # Root is needed to use the mounted Docker socket. Jenkins is bound to
    # localhost only, so it is not reachable from other machines.
    user: root
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=true

volumes:
  jenkins_home:
